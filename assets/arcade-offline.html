<!doctype html>
<!-- Offline Arcade: four mini games, served by /arcade-sw.js when a page can't load.
     Self-contained on purpose: nothing else is reachable when this shows.
     CUSTOMIZE: the site name in .logo, the colours in :root, the text in COPY.
     After editing, bump VERSION in /arcade-sw.js so returning visitors get the new copy. -->
<html lang="en" data-mode="offline" data-arcade>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>You're offline</title>
<style>
  /* CUSTOMIZE: page background, text and pixel colour, accent (logo dot, button hover), text on accent.
     Keep --ink and --accent readable on --bg, and --on-accent readable on --accent, in both blocks. */
  :root { --bg: #f7f7f7; --ink: #535353; --accent: #2f6fed; --on-accent: #ffffff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #202124; --ink: #acacac; } }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; min-height: 100%; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; min-height: 40px; }
  .logo { font-weight: 700; font-size: 18px; letter-spacing: .08em; color: inherit; text-decoration: none; text-transform: uppercase; }
  .logo span { color: var(--accent); }
  #notice { display: flex; align-items: center; gap: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  button { font: inherit; color: inherit; background: none; border: 2px solid var(--ink); padding: 6px 12px; cursor: pointer; text-transform: uppercase; letter-spacing: .06em; transition: background .1s, color .1s; }
  button:hover, button:focus-visible, #go { background: var(--ink); color: var(--bg); outline: none; }
  #go:hover, #go:focus-visible { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  [hidden] { display: none !important; }
  h1 { font-size: clamp(28px, 8vw, 44px); line-height: 1.1; letter-spacing: .04em; }
  #sub { margin-top: 8px; max-width: 48ch; }
  #grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 24px; }
  .card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; text-align: left; text-transform: none; letter-spacing: 0; transition: transform .1s, box-shadow .1s; }
  .card:hover, .card:focus-visible { background: none; color: inherit; transform: translate(-3px, -3px); box-shadow: 3px 3px 0 var(--ink); }
  .card canvas { height: 40px; width: auto; image-rendering: pixelated; margin-bottom: 8px; }
  .card b { font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
  .card small { font-size: 12px; }
  #play { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; flex-wrap: wrap; }
  .bar-actions { display: flex; align-items: center; gap: 8px; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  #screen { display: block; image-rendering: pixelated; }
  @media (max-width: 480px) { .card { padding: 12px; } #grid { gap: 8px; } }
</style>
</head>
<body>
<main>
  <header>
    <!-- CUSTOMIZE: your site name. The optional <span> is drawn in the accent colour. -->
    <a class="logo" href="/">Your Site<span>.</span></a>
    <div id="notice" role="status"><span id="notice-text"></span><button id="go" hidden></button></div>
  </header>
  <section id="menu">
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div id="grid"></div>
  </section>
  <section id="play" hidden>
    <div class="bar">
      <div class="bar-actions">
        <button id="back">&lt; Games</button>
        <button id="snd" title="Toggle Sound">SFX: ON</button>
      </div>
      <span id="hint"></span>
    </div>
    <div id="stage"><canvas id="screen" aria-label="Game screen"></canvas></div>
  </section>
</main>
<script>
(() => {
  "use strict";
  // CUSTOMIZE: [heading, sub-heading, status text, button label]
  const COPY = {
    offline: ["NO INTERNET.", "Pick a game while you wait. We'll let you know when you're back online.", "Offline"],
    slow: ["SLOW CONNECTION.", "Your page is still loading. Pick a game, we'll let you know when it's ready.", "Loading your page..."],
    online: ["BACK ONLINE.", "Your connection is back.", "You're back online.", "Continue"],
    ready: ["PAGE READY.", "Your page has finished loading.", "Your page is ready.", "Open page"],
  };
  const SELF = "/arcade-offline.html";

  const $ = (s) => document.querySelector(s);
  const touch = matchMedia("(pointer: coarse)").matches;
  const dark = matchMedia("(prefers-color-scheme: dark)");
  let INK, BG, ACCENT;
  const setColors = () => {
    const css = getComputedStyle(document.documentElement);
    INK = css.getPropertyValue("--ink").trim();
    BG = css.getPropertyValue("--bg").trim();
    ACCENT = css.getPropertyValue("--accent").trim() || INK;
  };
  setColors();

  // ---- Audio Engine (Lightweight 8-Bit Web Audio) ----
  let soundOn = true;
  const actx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
  function beep(f = 440, t = 0.08, type = "square") {
    if (!soundOn || !actx) return;
    try {
      if (actx.state === "suspended") actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, actx.currentTime);
      g.gain.setValueAtTime(0.04, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + t);
    } catch {}
  }
  const sndBtn = $("#snd");
  sndBtn.onclick = (e) => {
    e.stopPropagation();
    soundOn = !soundOn;
    sndBtn.textContent = soundOn ? "SFX: ON" : "SFX: OFF";
    if (soundOn) beep(520, 0.06);
  };

  // ---- Pixel drawing ----
  const rand = (n) => Math.random() * n;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pad = (n) => String(n).padStart(5, "0");
  const rect = (c, x, y, w, h) => c.fillRect(Math.round(x), Math.round(y), w, h);
  const box = (c, x, y, w, h) => { rect(c, x, y, w, 1); rect(c, x, y + h - 1, w, 1); rect(c, x, y, 1, h); rect(c, x + w - 1, y, 1, h); };
  function sprite(c, rows, x, y) {
    x = Math.round(x); y = Math.round(y);
    for (let j = 0; j < rows.length; j++)
      for (let i = 0; i < rows[j].length; i++) if (rows[j][i] === "#") c.fillRect(x + i, y + j, 1, 1);
  }
  // 3x5 pixel font, 15 bits per glyph, row by row.
  const GLYPHS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ.:!-'";
  const BITS = ("111101101101111 010110010010111 111001111100111 111001111001111 101101111001001 111100111001111 " +
    "111100111101111 111001001001001 111101111101111 111101111001111 010101111101101 110101110101110 " +
    "011100100100011 110101101101110 111100110100111 111100110100100 011100101101011 101101111101101 " +
    "111010010010111 001001001101010 101101110101101 100100100100111 101111111101101 110101101101101 " +
    "010101101101010 110101110100100 010101101110011 110101110101101 011100010001110 111010010010010 " +
    "101101101101111 101101101101010 101101111111101 101101010101101 101101010010010 111001010100111 " +
    "000000000000010 000010000010000 010010010000010 000000111000000 010010000000000").split(" ");
  function text(c, str, x, y, align) {
    str = String(str).toUpperCase();
    const w = str.length * 4 - 1;
    if (align === "center") x -= Math.floor(w / 2);
    else if (align === "right") x -= w;
    for (let i = 0; i < str.length; i++) {
      const b = BITS[GLYPHS.indexOf(str[i])];
      if (b) for (let p = 0; p < 15; p++) if (b[p] === "1") c.fillRect(x + i * 4 + (p % 3), y + ((p / 3) | 0), 1, 1);
    }
  }

  // ---- Sprites ----

  // 1. Astro Runner Sprites
  const ASTRO_BODY = [
    "....#####...",
    "...#######..",
    "..##.###.##.",
    "..##.###.##.",
    "..#########.",
    "...#######..",
    ".###########",
    "#.#########.",
    "#.#########.",
    "..#########.",
    "...#######..",
  ];
  const ASTRO_LEGS = [
    [
      "...###..##..",
      "..####..##..",
      "..##....##..",
    ],
    [
      "..##....##..",
      "..##...####.",
      "..##...###..",
    ],
    [
      "..######....",
      "..##..##....",
      "............",
    ],
  ];
  const SPACE_ROCK = [
    "....####....",
    "..########..",
    ".##########.",
    "############",
    "############",
    ".##########.",
    "############",
  ];
  const CRYSTAL_SPIRE = [
    "...#...",
    "..###..",
    ".##.##.",
    "#######",
    ".##.##.",
    ".##.##.",
    "#######",
    ".#####.",
    "#######",
  ];
  const UFO_DRONE = [
    "....###....",
    "..#######..",
    "###########",
    ".##.###.##.",
    "..#######..",
    "...#...#...",
  ];
  const SATURN = [
    ".....#####.....",
    "..###########..",
    "################",
    "..###########..",
    ".....#####.....",
  ];

  // 2. Snake Sprites
  const APPLE = [
    "...#...",
    "..#....",
    ".#####.",
    "#######",
    "#######",
    ".#####.",
    "..###..",
  ];
  const STAR_BONUS = [
    "...#...",
    "...#...",
    ".#####.",
    "#######",
    ".#####.",
    ".##.##.",
    "#.....#",
  ];
  const SNAKE_ICON = [
    "###.###.###......#.",
    "###.###.###.....###",
    "###.###.###......#.",
    "...................",
    "........###........",
    "........###........",
    "........###........",
    "...................",
    "........###.###....",
    "........###.###....",
    "........###.###....",
  ];

  // 3. Flappy Sprites
  const JET_BIRD = [
    [
      "...#####...",
      "..#######..",
      ".##.###.##.",
      "###########",
      ".#########.",
      "....###....",
      "...#####...",
    ],
    [
      "...#####...",
      ".#########.",
      "###########",
      ".##.###.##.",
      "..#######..",
      "....###....",
      "....###....",
    ],
  ];

  // 4. Hopper Sprites (New Breakout Replacement)
  const HOPPER_ICON = [
    "....#####....",
    "...#######...",
    "..##.#.#.##..",
    "..#########..",
    "...#######...",
    "....#####....",
    ".....###.....",
    "....#####....",
    "....#...#....",
    "....#...#....",
    "...##...##...",
  ];
  const HOPPER_CHAR = [
    "....#####....",
    "...#######...",
    "..##.#.#.##..",
    "..#########..",
    "...#######...",
    "....#####....",
    ".....###.....",
    "....#####....",
    "....#...#....",
    "...##...##...",
  ];
  const HOPPER_JUMP = [
    "....#####....",
    "...#######...",
    "..##.#.#.##..",
    "..#########..",
    "...#######...",
    "....#####....",
    "....#####....",
    "...##...##...",
    "....##.##....",
    ".............",
  ];
  const SPRING_IDLE = [
    "#####",
    ".#.#.",
    "#####",
  ];
  const SPRING_ACTIVE = [
    "#####",
    ".#.#.",
    "#####",
    ".#.#.",
    "#####",
  ];

  // ---- Games ----
  const HUD = 9;

  // 1. RUNNER (Moon Rover / Retro Astronaut Overhaul)
  const Runner = {
    id: "runner", name: "Astro Run", hint: touch ? "Tap to jump" : "Space or up to jump",
    W: matchMedia("(max-width: 600px)").matches ? 180 : 240, H: 90, GROUND: 78,
    icon: ASTRO_BODY.concat(ASTRO_LEGS[0]),
    reset() {
      this.y = 0; this.vy = 0; this.speed = 115; this.dist = 0; this.t = 0; this.buffer = 0;
      this.obs = []; this.next = 130; this.dead = false;
      this.stars = Array.from({ length: 22 }, () => [rand(this.W), 4 + rand(this.GROUND - 18), 0.5 + Math.random()]);
      this.saturn = [this.W - 35, 14];
      this.craters = Array.from({ length: 16 }, () => [rand(this.W), 2 + (rand(4) | 0), 2 + (rand(4) | 0)]);
      this.exhaust = [];
    },
    get score() { return Math.floor(this.dist / 10); },
    press() {
      this.buffer = 0.12;
      if (this.y === 0) beep(320, 0.08, "triangle");
    },
    spawn() {
      // Alien crystals, lunar rocks, or hovering alien UFO drones
      const kinds = [
        [[CRYSTAL_SPIRE, 0, 0]],
        [[CRYSTAL_SPIRE, 0, 0], [CRYSTAL_SPIRE, 8, 0]],
        [[SPACE_ROCK, 0, 0]],
        [[SPACE_ROCK, 0, 0], [SPACE_ROCK, 11, 0]],
        [[UFO_DRONE, 0, 16]], // hovering drone in jump path
      ];
      const parts = kinds[rand(this.score > 120 ? kinds.length : 3) | 0];
      const w = Math.max(...parts.map(([s, dx]) => dx + s[0].length));
      const h = Math.max(...parts.map(([s, , dy]) => dy + s.length));
      this.obs.push({ x: this.W, parts, w, h });
      this.next = this.speed * 0.6 + 45 + rand(this.speed * 0.8);
    },
    update(dt) {
      this.t += dt;
      this.speed = Math.min(270, this.speed + 3.2 * dt);
      const dx = this.speed * dt;
      this.dist += dx;
      this.buffer -= dt;
      if (this.buffer > 0 && this.y === 0) {
        this.vy = -265; this.buffer = 0;
        beep(360, 0.1, "triangle");
      }
      this.vy += 920 * dt;
      this.y += this.vy * dt;
      if (this.y >= 0) { this.y = 0; this.vy = 0; }

      // Jetpack exhaust particles while jumping
      if (this.y < 0 && Math.random() < 0.6) {
        this.exhaust.push({ x: 17 + rand(2), y: this.GROUND - 6 + this.y, life: 0.25 });
      }
      for (const p of this.exhaust) { p.x -= dx * 0.6; p.y += 18 * dt; p.life -= dt; }
      this.exhaust = this.exhaust.filter((p) => p.life > 0);

      if ((this.next -= dx) <= 0) this.spawn();
      for (const o of this.obs) o.x -= dx;
      this.obs = this.obs.filter((o) => o.x + o.w > -5);

      // Parallax starry sky & planet drift
      for (const s of this.stars) if ((s[0] -= dx * 0.12 * s[2]) < -3) { s[0] = this.W + rand(10); s[1] = 4 + rand(this.GROUND - 18); }
      if ((this.saturn[0] -= dx * 0.04) < -20) { this.saturn[0] = this.W + 20; }

      // Hitbox
      const px = 18, py = this.GROUND - 14 + this.y, pw = 9, ph = 13;
      for (const o of this.obs) {
        for (const [s, odx, ody] of o.parts) {
          const ox = o.x + odx, oy = this.GROUND - ody - s.length;
          const ow = s[0].length, oh = s.length;
          if (px + pw > ox + 1 && px < ox + ow - 1 && py + ph > oy + 1 && py < oy + oh) {
            this.dead = true;
            beep(130, 0.25, "sawtooth");
            return;
          }
        }
      }
    },
    draw(c) {
      // 1. Stars & Saturn
      c.globalAlpha = 0.45;
      sprite(c, SATURN, this.saturn[0], this.saturn[1]);
      for (const [x, y] of this.stars) rect(c, x, y, 1, 1);
      c.globalAlpha = 1;

      // 2. Moon Ground & Craters
      rect(c, 0, this.GROUND, this.W, 1);
      const off = this.dist % this.W;
      for (const [x, dy, w] of this.craters) rect(c, (x - off + this.W) % this.W, this.GROUND + dy, w, 1);

      // 3. Obstacles
      for (const o of this.obs) {
        for (const [s, dx, dy] of o.parts) sprite(c, s, o.x + dx, this.GROUND - dy - s.length);
      }

      // 4. Jetpack exhaust sparks
      c.globalAlpha = 0.7;
      for (const p of this.exhaust) rect(c, p.x, p.y, 2, 2);
      c.globalAlpha = 1;

      // 5. Astronaut
      const isAir = this.y < 0;
      const legs = isAir ? ASTRO_LEGS[2] : ASTRO_LEGS[(this.t * 11 | 0) % 2];
      sprite(c, ASTRO_BODY.concat(legs), 16, this.GROUND - 14 + this.y);
    },
  };

  // 2. SNAKE (Enhanced with Animated Directional Eyes, Cosmic Star Food & Particle Pops)
  const Snake = {
    id: "snake", name: "Snake", hint: touch ? "Swipe to steer" : "Arrow keys to steer",
    W: 162, H: 171, N: 20, icon: SNAKE_ICON,
    reset() {
      this.body = [[9, 10], [8, 10], [7, 10]]; this.d = [1, 0]; this.queue = [];
      this.acc = 0; this.step = 0.13; this.eaten = 0; this.dead = false;
      this.food = this.place();
      this.bonus = null; this.bonusTimer = 0;
      this.particles = [];
    },
    get score() { return this.eaten * 10 + (this.bonusPoints || 0); },
    dir(dx, dy) {
      const last = this.queue[this.queue.length - 1] || this.d;
      if (this.queue.length > 2 || (dx === -last[0] && dy === -last[1]) || (dx === last[0] && dy === last[1])) return;
      this.queue.push([dx, dy]);
    },
    place() {
      let p;
      do p = [rand(this.N) | 0, rand(this.N) | 0];
      while (this.body.some((b) => b[0] === p[0] && b[1] === p[1]) || (this.bonus && this.bonus[0] === p[0] && this.bonus[1] === p[1]));
      return p;
    },
    spawnParticles(gx, gy) {
      const cx = 1 + gx * 8 + 4, cy = HUD + gy * 8 + 4;
      for (let i = 0; i < 6; i++) {
        const a = Math.PI * 2 * (i / 6);
        this.particles.push({ x: cx, y: cy, vx: Math.cos(a) * 24, vy: Math.sin(a) * 24, life: 0.25 });
      }
    },
    update(dt) {
      // Particle updates
      for (const p of this.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
      this.particles = this.particles.filter((p) => p.life > 0);

      // Bonus star timer
      if (this.bonus) {
        if ((this.bonusTimer -= dt) <= 0) this.bonus = null;
      }

      for (this.acc += dt; this.acc >= this.step && !this.dead; this.acc -= this.step) {
        if (this.queue.length) this.d = this.queue.shift();
        const n = [this.body[0][0] + this.d[0], this.body[0][1] + this.d[1]];
        const eatApple = n[0] === this.food[0] && n[1] === this.food[1];
        const eatBonus = this.bonus && n[0] === this.bonus[0] && n[1] === this.bonus[1];
        const out = n[0] < 0 || n[1] < 0 || n[0] >= this.N || n[1] >= this.N;

        if (out || this.body.some((b, i) => (eatApple || eatBonus || i < this.body.length - 1) && b[0] === n[0] && b[1] === n[1])) {
          this.dead = true;
          beep(120, 0.25, "sawtooth");
          return;
        }

        this.body.unshift(n);
        if (eatBonus) {
          this.bonusPoints = (this.bonusPoints || 0) + 25;
          this.spawnParticles(n[0], n[1]);
          this.bonus = null;
          beep(620, 0.12, "sine");
        }
        if (!eatApple) {
          if (!eatBonus) this.body.pop();
        } else {
          this.eaten++;
          this.spawnParticles(n[0], n[1]);
          this.step = Math.max(0.06, this.step - 0.003);
          beep(480, 0.08, "square");
          if (this.body.length === this.N * this.N) { this.dead = true; return; }
          this.food = this.place();

          // Spawn bonus star every 4 apples
          if (this.eaten % 4 === 0 && !this.bonus) {
            this.bonus = this.place();
            this.bonusTimer = 7;
          }
        }
      }
    },
    draw(c) {
      box(c, 0, HUD - 1, this.W, this.H - HUD + 1);
      const at = ([x, y]) => [1 + x * 8, HUD + y * 8];

      // Draw body
      if (!this.dead || (Date.now() / 250 | 0) % 2) {
        for (let i = 0; i < this.body.length; i++) {
          const [bx, by] = at(this.body[i]);
          if (i === 0) {
            // Head
            rect(c, bx, by, 7, 7);
            // Directional animated eyes using background color
            c.fillStyle = BG;
            const [dx, dy] = this.d;
            if (dx === 1) { rect(c, bx + 4, by + 1, 2, 2); rect(c, bx + 4, by + 4, 2, 2); }
            else if (dx === -1) { rect(c, bx + 1, by + 1, 2, 2); rect(c, bx + 1, by + 4, 2, 2); }
            else if (dy === -1) { rect(c, bx + 1, by + 1, 2, 2); rect(c, bx + 4, by + 1, 2, 2); }
            else { rect(c, bx + 1, by + 4, 2, 2); rect(c, bx + 4, by + 4, 2, 2); }
            c.fillStyle = INK;
          } else {
            // Body segments with inset corner styling
            rect(c, bx + 1, by, 5, 7);
            rect(c, bx, by + 1, 7, 5);
          }
        }
      }

      // Draw apple
      sprite(c, APPLE, ...at(this.food));

      // Draw bonus cosmic star (blinks when expiring)
      if (this.bonus && (this.bonusTimer > 2 || (Date.now() / 150 | 0) % 2)) {
        sprite(c, STAR_BONUS, ...at(this.bonus));
      }

      // Draw eat particles
      for (const p of this.particles) rect(c, p.x, p.y, 2, 2);
    },
  };

  // 3. FLAPPY (Cyber Jet Bird & Sci-Fi Energy Pylons)
  const Flappy = {
    id: "flappy", name: "Flappy", hint: touch ? "Tap to flap" : "Space or up to flap",
    W: 144, H: 200, GROUND: 188, GAP: 58, PW: 18, icon: JET_BIRD[0],
    reset() {
      this.y = 90; this.vy = 0; this.pipes = []; this.next = 40; this.passed = 0;
      this.t = 0; this.dist = 0; this.dead = false; this.smoke = [];
      this.stars = Array.from({ length: 14 }, () => [rand(this.W), 14 + rand(this.GROUND - 24)]);
    },
    get score() { return this.passed; },
    press() {
      this.vy = -180;
      this.smoke.push({ x: 26, y: this.y + 3, life: 0.2 });
      beep(420, 0.08, "triangle");
    },
    update(dt) {
      this.t += dt;
      this.vy = Math.min(this.vy + 560 * dt, 260);
      this.y += this.vy * dt;
      if (this.y < HUD) { this.y = HUD; this.vy = 0; }
      const dx = 60 * dt;
      this.dist += dx;

      // Stars
      for (const s of this.stars) if ((s[0] -= dx * 0.2) < -2) s[0] = this.W + rand(10);

      // Jet exhaust smoke
      for (const p of this.smoke) { p.x -= dx * 0.8; p.life -= dt; }
      this.smoke = this.smoke.filter((p) => p.life > 0);

      if ((this.next -= dx) <= 0) {
        this.pipes.push({ x: this.W, gap: HUD + 18 + rand(this.GROUND - HUD - 36 - this.GAP) });
        this.next = 82;
      }
      for (const p of this.pipes) {
        p.x -= dx;
        if (!p.done && p.x + this.PW < 30) {
          p.done = true;
          this.passed++;
          beep(540, 0.08, "sine");
        }
      }
      this.pipes = this.pipes.filter((p) => p.x + this.PW > -4);

      const bx = 31, by = this.y + 1, bw = 9, bh = 5;
      this.dead = this.y + 7 >= this.GROUND || this.pipes.some((p) =>
        bx < p.x + this.PW && bx + bw > p.x && (by < p.gap || by + bh > p.gap + this.GAP));
      if (this.dead) beep(110, 0.25, "sawtooth");
    },
    draw(c) {
      // Drifting space dust
      c.globalAlpha = 0.35;
      for (const [x, y] of this.stars) rect(c, x, y, 1, 1);
      c.globalAlpha = 1;

      // Sci-fi Energy Pylons
      for (const p of this.pipes) {
        // Upper pylon
        box(c, p.x, HUD - 1, this.PW, p.gap - HUD + 1);
        rect(c, p.x + 3, HUD, 2, p.gap - HUD - 6);
        box(c, p.x - 2, p.gap - 6, this.PW + 4, 6);
        rect(c, p.x + 2, p.gap - 4, this.PW - 4, 2); // glowing emitter

        // Lower pylon
        box(c, p.x, p.gap + this.GAP, this.PW, this.GROUND - p.gap - this.GAP);
        rect(c, p.x + 3, p.gap + this.GAP + 6, 2, this.GROUND - p.gap - this.GAP - 6);
        box(c, p.x - 2, p.gap + this.GAP, this.PW + 4, 6);
        rect(c, p.x + 2, p.gap + this.GAP + 2, this.PW - 4, 2); // glowing emitter
      }

      // Ground
      rect(c, 0, this.GROUND, this.W, 1);
      for (let x = -(this.dist % 12); x < this.W; x += 12) rect(c, x, this.GROUND + 4, 6, 1);

      // Jet exhaust smoke
      c.globalAlpha = 0.7;
      for (const p of this.smoke) rect(c, p.x, p.y, 2, 2);
      c.globalAlpha = 1;

      // Jet Bird
      sprite(c, JET_BIRD[this.vy < 0 || (this.t * 6 | 0) % 2 ? 1 : 0], 30, this.y);
    },
  };

  // 4. HOPPER (Brand New Game Replacing Breakout: Doodle Jump & Bounce Arcade!)
  const Hopper = {
    id: "hopper", name: "Hopper", hint: touch ? "Drag to steer" : "A/D or arrows to steer",
    W: 160, H: 200, icon: HOPPER_ICON,
    reset() {
      this.x = (this.W - 13) / 2; this.y = 130;
      this.vx = 0; this.vy = -300;
      this.height = 0; this.maxHeight = 0;
      this.dead = false; this.targetX = null;
      this.sparks = [];

      // Generate initial platforms
      this.platforms = [
        { x: this.x - 8, y: 170, w: 32, type: "normal" }
      ];
      let y = 145;
      while (y > 10) {
        this.addPlatform(y);
        y -= 26 + (rand(10) | 0);
      }
    },
    get score() { return Math.floor(this.maxHeight / 6); },
    addPlatform(y) {
      const w = 24 + (rand(8) | 0);
      const x = rand(this.W - w);
      const r = Math.random();
      let type = "normal";
      if (r < 0.18) type = "moving";
      else if (r < 0.30) type = "spring";
      else if (r < 0.40) type = "crack";
      this.platforms.push({ x, y, w, type, dir: Math.random() < 0.5 ? 1 : -1, spring: 0, broken: false });
    },
    dir(dx) {
      if (dx !== 0) this.vx = dx * 130;
    },
    pointer(px) {
      this.targetX = clamp(px - 6, 0, this.W - 13);
    },
    update(dt) {
      // Horizontal controls
      if (this.targetX !== null) {
        const diff = this.targetX - this.x;
        if (Math.abs(diff) < 2) { this.x = this.targetX; this.targetX = null; this.vx = 0; }
        else { this.vx = Math.sign(diff) * Math.min(Math.abs(diff) / dt, 160); }
      } else {
        const move = ((held.ArrowRight || held.KeyD ? 1 : 0) - (held.ArrowLeft || held.KeyA ? 1 : 0)) * 140;
        this.vx = move;
      }

      this.x += this.vx * dt;
      // Screen wrapping left-right
      if (this.x < -8) this.x = this.W - 6;
      else if (this.x > this.W - 4) this.x = -6;

      // Vertical physics
      this.vy += 540 * dt;
      this.y += this.vy * dt;

      // Platform collisions (only when falling)
      const feet = this.y + 10;
      if (this.vy > 0) {
        for (const p of this.platforms) {
          if (p.broken) continue;
          if (feet >= p.y && feet - this.vy * dt <= p.y + 6 && this.x + 11 > p.x && this.x + 2 < p.x + p.w) {
            if (p.type === "crack") {
              p.broken = true;
              beep(160, 0.1, "sawtooth");
            } else if (p.type === "spring") {
              p.spring = 0.35;
              this.vy = -480;
              this.y = p.y - 10;
              beep(580, 0.18, "sine");
            } else {
              this.vy = -310;
              this.y = p.y - 10;
              beep(340, 0.08, "triangle");
            }
            // Bounce sparks
            for (let i = 0; i < 4; i++) this.sparks.push({ x: this.x + 6, y: feet, vx: (rand(40) - 20), vy: -rand(30), life: 0.18 });
            break;
          }
        }
      }

      // Camera upward scroll
      if (this.y < 82) {
        const shift = 82 - this.y;
        this.y = 82;
        this.height += shift;
        if (this.height > this.maxHeight) this.maxHeight = this.height;

        for (const p of this.platforms) p.y += shift;
        this.platforms = this.platforms.filter((p) => p.y < this.H + 12);

        // Spawn new platforms above
        const minY = Math.min(...this.platforms.map((p) => p.y));
        if (minY > 0) this.addPlatform(minY - (26 + (rand(10) | 0)));
      }

      // Moving platforms & springs
      for (const p of this.platforms) {
        if (p.type === "moving") {
          p.x += p.dir * 45 * dt;
          if (p.x <= 2) { p.x = 2; p.dir = 1; }
          else if (p.x + p.w >= this.W - 2) { p.x = this.W - p.w - 2; p.dir = -1; }
        }
        if (p.spring > 0) p.spring -= dt;
      }

      // Sparks
      for (const s of this.sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
      this.sparks = this.sparks.filter((s) => s.life > 0);

      // Death condition: fall below screen
      if (this.y > this.H + 12) {
        this.dead = true;
        beep(110, 0.3, "sawtooth");
      }
    },
    draw(c) {
      // HUD divider
      rect(c, 0, HUD - 1, this.W, 1);

      // Platforms
      for (const p of this.platforms) {
        if (p.broken) continue;
        if (p.type === "normal") {
          box(c, p.x, p.y, p.w, 4);
          rect(c, p.x + 2, p.y + 1, p.w - 4, 2);
        } else if (p.type === "moving") {
          // Striped moving platform
          box(c, p.x, p.y, p.w, 4);
          for (let sx = 2; sx < p.w - 2; sx += 4) rect(c, p.x + sx, p.y + 1, 2, 2);
        } else if (p.type === "crack") {
          // Cracked platform
          rect(c, p.x, p.y, Math.floor(p.w / 2) - 2, 3);
          rect(c, p.x + Math.floor(p.w / 2) + 2, p.y, Math.floor(p.w / 2) - 2, 3);
        } else if (p.type === "spring") {
          box(c, p.x, p.y, p.w, 4);
          const spr = p.spring > 0 ? SPRING_ACTIVE : SPRING_IDLE;
          sprite(c, spr, p.x + Math.floor(p.w / 2) - 2, p.y - spr.length);
        }
      }

      // Sparks
      for (const s of this.sparks) rect(c, s.x, s.y, 1, 1);

      // Hopper character (rising = jump sprite, falling = ready sprite)
      const s = this.vy < 0 ? HOPPER_JUMP : HOPPER_CHAR;
      sprite(c, s, this.x, this.y);
    },
  };

  const GAMES = [Runner, Snake, Flappy, Hopper];

  // ---- High scores ----
  const getHi = (g) => { try { return +localStorage.getItem("arcade-hi-" + g.id) || 0; } catch { return 0; } };
  const setHi = (g, v) => { try { localStorage.setItem("arcade-hi-" + g.id, v); } catch {} };

  // ---- Menu ----
  function renderMenu() {
    const grid = $("#grid");
    grid.textContent = "";
    for (const g of GAMES) {
      const card = document.createElement("button");
      card.className = "card";
      const icon = document.createElement("canvas");
      icon.width = g.icon[0].length; icon.height = g.icon.length;
      const c = icon.getContext("2d");
      c.fillStyle = INK;
      sprite(c, g.icon, 0, 0);
      const name = document.createElement("b"), hint = document.createElement("small"), hi = document.createElement("small");
      name.textContent = g.name; hint.textContent = g.hint; hi.textContent = "HI " + pad(getHi(g));
      card.append(icon, name, hint, hi);
      card.onclick = () => open(g);
      grid.append(card);
    }
  }

  // ---- Game screen ----
  const canvas = $("#screen"), ctx = canvas.getContext("2d"), stage = $("#stage");
  const held = {};
  let game = null, state = "ready", overAt = 0;

  function open(g) {
    game = g; state = "ready"; g.reset();
    canvas.width = g.W; canvas.height = g.H;
    $("#hint").textContent = g.hint;
    $("#menu").hidden = true; $("#play").hidden = false;
    fit();
  }
  function close() {
    game = null;
    $("#play").hidden = true; $("#menu").hidden = false;
    renderMenu();
  }
  function fit() {
    if (!game) return;
    const w = stage.clientWidth, h = innerHeight - stage.getBoundingClientRect().top - 16;
    const s = Math.max(1, Math.min(w / game.W, h / game.H));
    canvas.style.width = Math.floor(game.W * s) + "px";
    canvas.style.height = Math.floor(game.H * s) + "px";
  }
  function press() {
    if (!game) return;
    if (state === "play") return game.press && game.press();
    if (state === "over" && performance.now() - overAt < 500) return;
    game.reset(); state = "play";
    if (game.press) game.press();
  }

  let last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min((t - last) / 1000, 1 / 30);
    last = t;
    if (!game) return;
    if (state === "play") {
      game.update(dt);
      if (game.dead) {
        state = "over"; overAt = performance.now();
        if (game.score > getHi(game)) setHi(game, game.score);
      }
    }
    ctx.fillStyle = BG; ctx.fillRect(0, 0, game.W, game.H);
    ctx.fillStyle = INK;
    game.draw(ctx);
    const hi = getHi(game);
    text(ctx, (hi ? "HI " + pad(hi) + "  " : "") + pad(game.score), game.W - 2, 2, "right");
    if (state !== "play") {
      const lines = state === "ready"
        ? [touch ? "TAP TO START" : "PRESS SPACE TO START"]
        : ["GAME OVER", touch ? "TAP TO RETRY" : "SPACE TO RETRY"];
      const w = Math.max(...lines.map((l) => l.length * 4 - 1)), y = Math.round(game.H / 2) - lines.length * 4;
      ctx.fillStyle = BG; ctx.fillRect(Math.round((game.W - w) / 2) - 4, y - 4, w + 8, lines.length * 8 + 6);
      ctx.fillStyle = INK;
      lines.forEach((l, i) => text(ctx, l, Math.round(game.W / 2), y + i * 8, "center"));
    }
  }
  requestAnimationFrame(frame);

  // ---- Input ----
  const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0] };
  addEventListener("keydown", (e) => {
    if (!game) return;
    if (e.code === "Escape") return close();
    const d = DIRS[e.code];
    if (!d && e.code !== "Space" && e.code !== "Enter") return;
    e.preventDefault();
    held[e.code] = true;
    if (e.repeat) return;
    if (state !== "play") press();
    else if (!d || (!game.dir && d[1] < 0)) game.press && game.press();
    if (d && game.dir) game.dir(d[0], d[1]);
  });
  addEventListener("keyup", (e) => { held[e.code] = false; });

  let down = false, sx = 0, sy = 0;
  const pointer = (e) => {
    if (!game || !game.pointer) return;
    const r = canvas.getBoundingClientRect();
    game.pointer((e.clientX - r.left) / r.width * game.W);
  };
  stage.addEventListener("pointerdown", (e) => {
    if (!game) return;
    e.preventDefault();
    down = true; sx = e.clientX; sy = e.clientY;
    if (stage.setPointerCapture) stage.setPointerCapture(e.pointerId);
    press();
    pointer(e);
  });
  stage.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" || down) pointer(e);
    if (!down || !game || !game.dir || state !== "play") return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) game.dir(Math.sign(dx), 0);
    else game.dir(0, Math.sign(dy));
    sx = e.clientX; sy = e.clientY;
  });
  addEventListener("pointerup", () => { down = false; });
  addEventListener("pointercancel", () => { down = false; });
  addEventListener("resize", fit);
  $("#back").onclick = close;
  dark.addEventListener("change", () => { setColors(); if (!game) renderMenu(); });

  // ---- Connection status ----
  let poll = 0;
  function status(mode) {
    const [title, sub, note, cta] = COPY[mode];
    $("#title").textContent = title;
    $("#sub").textContent = sub;
    $("#notice-text").textContent = note;
    document.title = `${note} | ${$(".logo").textContent}`;
    $("#go").hidden = !cta;
    $("#go").textContent = cta || "";
    if (mode === "offline" && !poll) {
      const check = () => navigator.onLine && fetch(SELF, { method: "HEAD", cache: "no-store" }).then(() => status("online"), () => {});
      addEventListener("online", check);
      poll = setInterval(check, 5000);
    }
    if (cta) clearInterval(poll);
  }
  $("#go").onclick = () => {
    if (location.pathname !== SELF) return location.reload();
    const from = new URL(new URLSearchParams(location.search).get("from") || "/", location.origin);
    location.assign(from.origin === location.origin ? from.pathname + from.search + from.hash : "/");
  };
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.onmessage = (e) => {
      if (!e.data || e.data.url !== location.href.split("#")[0]) return;
      status(e.data.type === "failed" ? "offline" : e.data.type);
    };
  }

  status(document.documentElement.dataset.mode === "slow" ? "slow" : "offline");
  renderMenu();
})();
</script>
</body>
</html>
